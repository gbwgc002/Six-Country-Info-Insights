name: AI Design + Insights Weekly Push

on:
  push:
    branches:
      - agent/ai-design-combined-push
  workflow_run:
    workflows:
      - AI Insights Weekly Publish
    types:
      - completed
  workflow_dispatch:
    inputs:
      chat_id:
        description: Target Feishu chat ID (defaults to repository variable or test group)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ai-design-combined-weekly-push
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore last successful design-feed state
        uses: actions/cache/restore@v4
        with:
          path: .cache/ai-design-feed/last-success.json
          key: ai-design-feed-state-${{ github.run_id }}
          restore-keys: |
            ai-design-feed-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "aiohttp>=3.13.3" \
            "beautifulsoup4>=4.12.0" \
            "python-dotenv>=1.0.0"

      - name: Validate isolated feed, state, alert, and card logic
        run: python -m unittest tests.test_design_ai_weekly_push -v

      - name: Push combined card or alert the test group
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          AI_DESIGN_FEISHU_CHAT_ID: >-
            ${{ inputs.chat_id || vars.AI_DESIGN_FEISHU_CHAT_ID ||
                'oc_d4411bf497444ec7d818d18b3738773d' }}
          AI_DESIGN_ALERT_CHAT_ID: >-
            ${{ vars.AI_DESIGN_ALERT_CHAT_ID ||
                'oc_d4411bf497444ec7d818d18b3738773d' }}
          AI_DESIGN_STATE_PATH: .cache/ai-design-feed/last-success.json
          AI_INSIGHTS_UPSTREAM_CONCLUSION: >-
            ${{ github.event_name == 'push' && '模拟异常测试' ||
                (github.event_name == 'workflow_run' &&
                 github.event.workflow_run.conclusion || '') }}
        run: python design_ai_weekly_push.py

      - name: Save last successful design-feed state
        if: ${{ always() && hashFiles('.cache/ai-design-feed/last-success.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/ai-design-feed/last-success.json
          key: ai-design-feed-state-${{ github.run_id }}
