name: AI Design + Insights Weekly Push

on:
  workflow_run:
    workflows:
      - AI Insights Weekly Publish
    types:
      - completed
  workflow_dispatch:
    inputs:
      chat_id:
        description: Target Feishu chat ID (defaults to the current test group)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ai-design-combined-weekly-push
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "aiohttp>=3.13.3" \
            "beautifulsoup4>=4.12.0" \
            "playwright>=1.58.0" \
            "python-dotenv>=1.0.0"

      - name: Check fixed design JSON feed
        id: design-feed
        shell: bash
        run: |
          if python design_ai_weekly_push.py --check-design-feed; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install browser for rendered-page fallback
        if: steps.design-feed.outputs.ready != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Validate isolated crawler and card logic
        run: python -m unittest tests.test_design_ai_weekly_push -v

      - name: Push combined AI design and AI insights card
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          AI_DESIGN_FEISHU_CHAT_ID: >-
            ${{ inputs.chat_id || vars.AI_DESIGN_FEISHU_CHAT_ID ||
                'oc_d4411bf497444ec7d818d18b3738773d' }}
        run: python design_ai_weekly_push.py
