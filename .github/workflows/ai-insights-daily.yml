name: AI Insights Daily Collection

on:
  # Every day at 07:30 UTC+8 (23:30 UTC on the previous date).
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

concurrency:
  group: ai-insights-feishu-document
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect AI insight candidates
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GEMINI_MODEL: gemini-3.6-flash
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_ADMIN_OPEN_ID: ${{ secrets.FEISHU_ADMIN_OPEN_ID }}
          FEISHU_BOT_CHAT_ID: ${{ secrets.FEISHU_GROUP_RUANJIANYONGYAN_ID }}
        run: python ai_insights.py collect
