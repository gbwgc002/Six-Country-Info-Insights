name: Seven-Country Info Insights

on:
  # 每天北京时间早上06:25运行 (UTC 22:25 前一天)
  schedule:
    - cron: '25 22 * * *'

  # 手动触发
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'Optional Feishu chat_id; leave empty for the production group'
        required: false
        type: string
        default: ''
      send_email:
        description: 'Send the email copy during this manual run'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Keep production schedules serialized, while every manual test gets its own group.
  group: seven-country-daily-digest-${{ github.event_name == 'schedule' && 'production' || github.run_id }}
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # WeasyPrint dependencies
          sudo apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info
          # Chinese fonts for PDF generation
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei fonts-wqy-microhei

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Seven-Country Info Insights
        env:
          # Google Cloud project ID
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }} 

          # Gemini (Vertex AI) service account JSON
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GEMINI_MODEL: gemini-3.6-flash

          # Email configuration (Gmail SMTP)
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.SMTP_USER }}
          TO_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.send_email && secrets.TO_EMAIL || (github.event_name == 'schedule' && secrets.TO_EMAIL || '') }}

          # Feishu Configuration
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_ADMIN_OPEN_ID: ${{ secrets.FEISHU_ADMIN_OPEN_ID }}  
          FEISHU_BOT_CHAT_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.chat_id || secrets.FEISHU_GROUP_RUANJIANYONGYAN_ID }}

          # Scheduled production runs must obtain a Feishu API acknowledgement.
          REQUIRE_FEISHU_DELIVERY: ${{ github.event_name == 'schedule' }}
          MONITOR_RECEIPT_PATH: output/monitor/receipt.json

        run: |
          python main.py

      - name: Upload debug log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-log
          path: |
            *.log
            debug/
          retention-days: 7

      - name: Upload sanitized monitor receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-country-monitor-receipt-${{ github.run_attempt }}
          path: output/monitor/receipt.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
