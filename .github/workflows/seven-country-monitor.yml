name: Production Push Delivery Monitor

# Migration note: this replaces the seven-country-monitor-receipt artifact and
# seven-country-runs.json feed. Legacy selector was:
# workflows: ["Seven-Country Info Insights"]

on:
  workflow_run:
    workflows:
      - Seven-Country Info Insights
      - AI Insights Weekly Publish
      - AI Design + Insights Weekly Push
      - Five-Country Weekly Insights
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: production-push-monitor-data
  cancel-in-progress: false

jobs:
  aggregate:
    if: >-
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch' ||
       (github.event.workflow_run.name == 'AI Design + Insights Weekly Push' &&
        github.event.workflow_run.event == 'workflow_run'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download sanitized receipt
        id: receipt
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: push-monitor-receipt-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/push-monitor-receipt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Aggregate and publish monitor data
        env:
          RECEIPT_PATH: ${{ runner.temp }}/push-monitor-receipt/receipt.json
          AGGREGATOR_PATH: ${{ runner.temp }}/aggregate_monitor_receipt.py
        run: |
          cp scripts/aggregate_monitor_receipt.py "$AGGREGATOR_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin monitor-data >/dev/null 2>&1; then
            git fetch origin monitor-data
            git switch --force-create monitor-data origin/monitor-data
          else
            git switch --orphan monitor-data
            git rm --cached --ignore-unmatch -r .
          fi

          mkdir -p data
          if [ ! -f push-monitor-runs.json ] && [ -f seven-country-runs.json ]; then
            cp seven-country-runs.json push-monitor-runs.json
          fi
          python "$AGGREGATOR_PATH" \
            --receipt "$RECEIPT_PATH" \
            --workflow-run "$GITHUB_EVENT_PATH" \
            --output push-monitor-runs.json
          touch .nojekyll

          git add push-monitor-runs.json .nojekyll
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update production push delivery monitor"

          for attempt in 1 2 3; do
            if git push origin HEAD:monitor-data; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Monitor data push failed after 3 attempts" >&2
              exit 1
            fi

            # Rebuild from the newest dedicated data branch instead of
            # overwriting a record published by another writer.
            git fetch origin monitor-data
            git switch --force-create monitor-data origin/monitor-data
            if [ ! -f push-monitor-runs.json ] && [ -f seven-country-runs.json ]; then
              cp seven-country-runs.json push-monitor-runs.json
            fi
            python "$AGGREGATOR_PATH" \
              --receipt "$RECEIPT_PATH" \
              --workflow-run "$GITHUB_EVENT_PATH" \
              --output push-monitor-runs.json
            touch .nojekyll
            git add push-monitor-runs.json .nojekyll
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Update production push delivery monitor"
          done
