name: AI Insights One-time Backfill

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ai-insights-backfill-once.yml"

permissions:
  contents: read

concurrency:
  group: ai-insights-feishu-document
  cancel-in-progress: false

jobs:
  backfill:
    if: contains(github.event.head_commit.message, '[ai-insights-backfill-20260720]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill AI Insights for 2026-07-20 through 2026-07-26
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          GEMINI_MODEL: gemini-3.6-flash
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_ADMIN_OPEN_ID: ${{ secrets.FEISHU_ADMIN_OPEN_ID }}
          FEISHU_BOT_CHAT_ID: ${{ secrets.FEISHU_BOT_CHAT_ID }}
        run: |
          python - <<'PY'
          import asyncio
          from datetime import datetime as RealDateTime, timezone
          from zoneinfo import ZoneInfo

          import ai_insights

          zone = ZoneInfo("Asia/Shanghai")
          fixed_local = RealDateTime(2026, 7, 26, 23, 59, tzinfo=zone)
          week_start_utc = RealDateTime(2026, 7, 20, 0, 0, tzinfo=zone).astimezone(timezone.utc)
          next_week_utc = RealDateTime(2026, 7, 27, 0, 0, tzinfo=zone).astimezone(timezone.utc)

          class FixedDateTime(RealDateTime):
              @classmethod
              def now(cls, tz=None):
                  if tz is None:
                      return fixed_local.replace(tzinfo=None)
                  return fixed_local.astimezone(tz)

          original_filter = ai_insights.filter_recent_candidates

          def filter_backfill_week(items, lookback_hours=48, max_raw_items=80, now=None):
              candidates = original_filter(
                  items,
                  lookback_hours=24 * 8,
                  max_raw_items=250,
                  now=fixed_local,
              )
              filtered = []
              for item in candidates:
                  published = item.published
                  if published is None:
                      continue
                  if published.tzinfo is None:
                      published = published.replace(tzinfo=timezone.utc)
                  published_utc = published.astimezone(timezone.utc)
                  if week_start_utc <= published_utc < next_week_utc:
                      filtered.append(item)
              return filtered

          ai_insights.datetime = FixedDateTime
          ai_insights.filter_recent_candidates = filter_backfill_week

          config = ai_insights.load_config()
          config.setdefault("settings", {})
          config["settings"]["daily_lookback_hours"] = 24 * 8
          config["settings"]["max_raw_items"] = 250
          config["settings"]["max_daily_items"] = 24

          raise SystemExit(asyncio.run(ai_insights.collect_daily(config)))
          PY
