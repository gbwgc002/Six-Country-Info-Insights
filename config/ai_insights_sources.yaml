# AI Insights Weekly - AI 洞察资讯周报
# This pipeline is intentionally independent from config/sources.yaml.

settings:
  timezone: "Asia/Shanghai"
  daily_lookback_hours: 159
  max_raw_items: 80
  max_daily_items: 8
  max_weekly_items: 10
  vendor_weekly_cap: 3
  existing_context_chars: 12000

rss_sources:
  # ============================================================
  # 1. User research, market research, and UX practice
  # ============================================================
  nngroup:
    name: "Nielsen Norman Group"
    url: "https://www.nngroup.com/feed/rss/"
    category: "user_research"
    source_kind: "professional"
    source_tier: 1
    keywords: ["AI", "artificial intelligence", "agent", "LLM", "machine learning", "automation", "synthetic"]
    max_items: 12
    enabled: true

  measuringu:
    name: "MeasuringU"
    url: "https://measuringu.com/feed/"
    category: "user_research"
    source_kind: "professional"
    source_tier: 1
    keywords: ["AI", "artificial intelligence", "machine learning", "synthetic", "automation", "LLM"]
    max_items: 10
    enabled: true

  dovetail:
    name: "Dovetail"
    url: "https://dovetail.com/blog/rss.xml"
    category: "research_tools"
    source_kind: "vendor"
    source_tier: 2
    keywords: ["AI", "artificial intelligence", "automation", "agent", "research", "insight"]
    max_items: 10
    enabled: true

  great_question:
    name: "Great Question"
    url: "https://greatquestion.co/blog/rss.xml"
    category: "research_tools"
    source_kind: "vendor"
    source_tier: 2
    keywords: ["AI", "artificial intelligence", "automation", "agent", "research", "MCP"]
    max_items: 10
    enabled: true

  ux_collective:
    name: "UX Collective"
    url: "https://uxdesign.cc/feed"
    category: "user_research"
    source_kind: "professional"
    source_tier: 2
    keywords: ["AI", "artificial intelligence", "agent", "LLM", "synthetic user", "research"]
    max_items: 10
    enabled: true

  research_industry_ai:
    name: "Research Industry AI Watch"
    url: "https://news.google.com/rss/search?q=%28site%3Agreenbook.org%20OR%20site%3Aresearch-live.com%29%20%28AI%20OR%20%22artificial%20intelligence%22%29&hl=en-US&gl=US&ceid=US%3Aen"
    category: "user_research"
    source_kind: "professional"
    source_tier: 2
    keywords: []
    max_items: 12
    enabled: true

  ai_research_tools_watch:
    name: "AI Research Tools Watch"
    url: "https://news.google.com/rss/search?q=%28%22AI%20user%20research%22%20OR%20%22AI%20market%20research%22%20OR%20%22synthetic%20users%22%20OR%20%22AI%20interviews%22%29&hl=en-US&gl=US&ceid=US%3Aen"
    category: "research_tools"
    source_kind: "news_aggregation"
    source_tier: 2
    keywords: []
    max_items: 15
    enabled: true

  # ============================================================
  # 2. Human-AI interaction, multilingual AI, and research papers
  # ============================================================
  microsoft_research:
    name: "Microsoft Research"
    url: "https://www.microsoft.com/en-us/research/feed/"
    category: "human_ai"
    source_kind: "research"
    source_tier: 1
    keywords: ["human-AI", "HCI", "user study", "interaction", "agent", "LLM", "language", "speech", "responsible AI"]
    max_items: 12
    enabled: true

  google_research:
    name: "Google Research"
    url: "https://research.google/blog/rss/"
    category: "human_ai"
    source_kind: "research"
    source_tier: 1
    keywords: ["human", "interaction", "user", "agent", "language", "speech", "multilingual", "responsible", "LLM"]
    max_items: 12
    enabled: true

  stanford_hai:
    name: "Stanford HAI"
    url: "https://hai.stanford.edu/news/rss.xml"
    category: "human_ai"
    source_kind: "research"
    source_tier: 1
    keywords: []
    max_items: 10
    enabled: true

  speech_language_ai_watch:
    name: "Speech & Multilingual AI Watch"
    url: "https://news.google.com/rss/search?q=%28%22speaker%20diarization%22%20OR%20%22speech%20to%20text%22%20OR%20%22real-time%20translation%22%20OR%20%22low-resource%20language%22%29%20AI&hl=en-US&gl=US&ceid=US%3Aen"
    category: "speech_language"
    source_kind: "news_aggregation"
    source_tier: 2
    keywords: []
    max_items: 15
    enabled: true

arxiv:
  enabled: true
  categories:
    - "cs.HC"
    - "cs.CL"
  max_results: 50
  filter_companies: false

  # ============================================================
  # 3. Major AI releases and industry developments
  # ============================================================
